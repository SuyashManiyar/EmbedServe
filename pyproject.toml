[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "embedserve"
version = "0.1.0"
description = "Two-tier, quantized embedding store for serving a DLRM-style recommender"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "rocksdict>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
model = ["torch>=2.2", "scikit-learn>=1.4"]

[tool.setuptools]
packages = ["embedserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
